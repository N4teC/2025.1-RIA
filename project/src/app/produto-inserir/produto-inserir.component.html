<div class="container mt-5">
  <p-toast></p-toast>
  
  <div class="box">
    <h2 class="title is-4 has-text-primary">Novo Produto</h2>
    
    <div class="content">
      <div class="field">
        <label for="nome" class="label has-text-weight-semibold">Nome (String) *</label>
        <div class="control">
          <input
            type="text"
            pInputText
            class="input"
            id="nome"
            [(ngModel)]="produto.nome"
            required
            autofocus
            [ngClass]="{ 'is-danger': submitted && !produto.nome }"
            placeholder="Ex: Notebook Gamer"
          />
        </div>
        <p class="help is-danger" *ngIf="submitted && !produto.nome">
          Nome é obrigatório.
        </p>
      </div>

      <div class="field">
        <label for="preco" class="label has-text-weight-semibold">Preço (Number) *</label>
        <div class="control">
          <p-inputNumber
            id="preco"
            [(ngModel)]="produto.preco"
            [min]="0"
            mode="currency"
            currency="BRL"
            locale="pt-BR"
            [ngClass]="{ 'is-danger': submitted && !produto.preco }"
            placeholder="R$ 0,00"
          ></p-inputNumber>
        </div>
        <p class="help is-danger" *ngIf="submitted && !produto.preco">
          Preço é obrigatório.
        </p>
      </div>

      <div class="field">
        <label for="disponivel" class="label has-text-weight-semibold">Disponível (Boolean)</label>
        <div class="field is-grouped">
          <div class="control">
            <p-inputSwitch
              [(ngModel)]="produto.disponivel"
              id="disponivel"
            ></p-inputSwitch>
          </div>
          <div class="control">
            <span
              class="tag"
              [ngClass]="produto.disponivel ? 'is-success' : 'is-warning'"
            >
              {{ produto.disponivel ? "Disponível" : "Indisponível" }}
            </span>
          </div>
        </div>
      </div>
      
      <div class="field is-grouped mt-5">
        <div class="control">
          <button
            pButton
            pRipple
            label="Cancelar"
            icon="pi pi-times"
            class="p-button-text"
            (click)="onCancelar()"
          ></button>
        </div>
        <div class="control">
          <button
            pButton
            pRipple
            label="Criar"
            icon="pi pi-check"
            class="p-button-primary"
            (click)="onSalvar()"
          ></button>
        </div>
      </div>
    </div>
  </div>
</div>
