<p-dialog
  [(visible)]="visible"
  (visibleChange)="onVisibleChange($event)"
  [style]="{ width: '450px' }"
  header="Editar Produto"
  [modal]="true"
  class="p-fluid"
>
  <ng-template pTemplate="content">
    <div class="content">
      <div class="field">
        <label for="nome" class="label has-text-weight-semibold"
          >Nome (String) *</label
        >
        <div class="control">
          <input
            type="text"
            pInputText
            class="input"
            id="nome"
            [(ngModel)]="produtoEditavel.nome"
            required
            autofocus
            [ngClass]="{ 'is-danger': submitted && !produtoEditavel.nome }"
            placeholder="Ex: Notebook Gamer"
          />
        </div>
        <p class="help is-danger" *ngIf="submitted && !produtoEditavel.nome">
          Nome é obrigatório.
        </p>
      </div>

      <div class="field">
        <label for="preco" class="label has-text-weight-semibold"
          >Preço (Number) *</label
        >
        <div class="control">
          <p-inputNumber
            id="preco"
            [(ngModel)]="produtoEditavel.preco"
            [min]="0"
            mode="currency"
            currency="BRL"
            locale="pt-BR"
            [ngClass]="{ 'is-danger': submitted && !produtoEditavel.preco }"
            placeholder="R$ 0,00"
          ></p-inputNumber>
        </div>
        <p class="help is-danger" *ngIf="submitted && !produtoEditavel.preco">
          Preço é obrigatório.
        </p>
      </div>

      <div class="field">
        <label for="disponivel" class="label has-text-weight-semibold"
          >Disponível (Boolean)</label
        >
        <div class="field is-grouped">
          <div class="control">
            <p-inputSwitch
              [(ngModel)]="produtoEditavel.disponivel"
              id="disponivel"
            ></p-inputSwitch>
          </div>
          <div class="control">
            <span
              class="tag"
              [ngClass]="produtoEditavel.disponivel ? 'is-success' : 'is-warning'"
            >
              {{ produtoEditavel.disponivel ? "Disponível" : "Indisponível" }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="field is-grouped is-grouped-right">
      <div class="control">
        <button
          pButton
          pRipple
          label="Cancelar"
          icon="pi pi-times"
          class="p-button-text"
          (click)="onCancelar()"
        ></button>
      </div>
      <div class="control">
        <button
          pButton
          pRipple
          label="Salvar"
          icon="pi pi-check"
          class="p-button-primary"
          (click)="onSalvar()"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
