<p-toast></p-toast>

<section class="section">
  <div class="container">
    <div class="has-text-centered mb-5">
      <h1 class="title is-2 has-text-primary">
        <i class="pi pi-shopping-cart mr-2"></i>Gerenciador de Produtos
      </h1>
      <p class="subtitle is-5 has-text-grey">
        Operações CRUD com Componentes Separados
      </p>
    </div>

    <!-- Componente de Listagem -->
    <app-produto-listar
      [produtos]="produtos"
      (novoProduto)="onNovoProduto()"
      (editarProduto)="onEditarProduto($event)"
      (excluirProduto)="onExcluirProduto($event)"
      (detalharProduto)="onDetalharProduto($event)"
    ></app-produto-listar>
  </div>
</section>

<!-- Componente de Inserção -->
<app-produto-inserir
  [(visible)]="dialogInserir"
  (produtoSalvo)="onProdutoInserido($event)"
></app-produto-inserir>

<!-- Componente de Atualização -->
<app-produto-atualizar
  [(visible)]="dialogAtualizar"
  [produto]="produtoSelecionado"
  (produtoAtualizado)="onProdutoAtualizado($event)"
></app-produto-atualizar>

<!-- Componente de Detalhes -->
<app-produto-detalhar
  [(visible)]="dialogDetalhar"
  [produto]="produtoSelecionado"
></app-produto-detalhar>

<!-- Componente de Exclusão -->
<app-produto-excluir
  [(visible)]="dialogExcluir"
  [produto]="produtoSelecionado"
  (produtoExcluido)="onProdutoExcluido($event)"
></app-produto-excluir>
