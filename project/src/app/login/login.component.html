<div class="login-container">
  <p-card header="Login" class="login-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email:</label>
        <input
          pInputText
          id="email"
          formControlName="email"
          placeholder="Digite seu email"
          [class.ng-invalid]="email?.invalid && email?.touched"
        />
        <small
          class="p-error"
          *ngIf="email?.invalid && email?.touched"
        >
          <span *ngIf="email?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="email?.errors?.['email']">Email deve ser válido</span>
        </small>
      </div>

      <div class="field">
        <label for="senha">Senha:</label>
        <p-password
          formControlName="senha"
          placeholder="Digite sua senha"
          [feedback]="false"
          [toggleMask]="true"
          [class.ng-invalid]="senha?.invalid && senha?.touched"
        ></p-password>
        <small
          class="p-error"
          *ngIf="senha?.invalid && senha?.touched"
        >
          <span *ngIf="senha?.errors?.['required']">Senha é obrigatória</span>
          <span *ngIf="senha?.errors?.['minlength']">Senha deve ter pelo menos 6 caracteres</span>
        </small>
      </div>

      <p-message
        severity="error"
        [text]="error"
        *ngIf="error"
        class="error-message"
      ></p-message>

      <div class="login-actions">
        <p-button
          label="Entrar"
          type="submit"
          [disabled]="loginForm.invalid || loading"
          [loading]="loading"
          styleClass="w-full"
        ></p-button>
      </div>
    </form>

    <div class="login-info">
      <p><strong>Credenciais de teste:</strong></p>
      <p>Email: admin&#64;email.com | Senha: 123456</p>
      <p>Email: user&#64;email.com | Senha: 123456</p>
    </div>
  </p-card>
</div>
